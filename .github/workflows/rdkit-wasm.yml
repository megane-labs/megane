name: rdkit-wasm

# Builds RDKit's ETKDG embedding to WebAssembly (rdkit-wasm/) and uploads
# dist/ as an artifact. The RDKit compile is the slow part (tens of minutes),
# so rdkit-wasm/.deps is cached on the pinned versions in scripts/build.sh;
# a cache hit only relinks the wrapper.

on:
  pull_request:
    paths:
      - "rdkit-wasm/**"
      - ".github/workflows/rdkit-wasm.yml"
  push:
    branches: [main]
    paths:
      - "rdkit-wasm/**"
      - ".github/workflows/rdkit-wasm.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rdkit-wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build rdkit-embed.wasm
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      RDKIT_TAG: Release_2026_03_6
      BOOST_VERSION: 1.87.0
      ZLIB_TAG: v1.3.1
      EMSDK_VERSION: 6.0.9
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libeigen3-dev

      - name: Cache toolchain and RDKit build tree
        uses: actions/cache@v4
        with:
          path: rdkit-wasm/.deps
          key: rdkit-wasm-deps-${{ runner.os }}-${{ env.RDKIT_TAG }}-${{ env.BOOST_VERSION }}-${{ env.ZLIB_TAG }}-${{ env.EMSDK_VERSION }}-${{ hashFiles('rdkit-wasm/scripts/build.sh') }}

      - name: Fetch dependencies
        run: bash rdkit-wasm/scripts/build.sh deps

      - name: Build RDKit static libraries
        run: bash rdkit-wasm/scripts/build.sh rdkit

      - name: Build wrapper
        run: bash rdkit-wasm/scripts/build.sh wrapper

      - name: Smoke test
        run: node rdkit-wasm/test/smoke.mjs

      - name: Report size
        run: ls -la rdkit-wasm/dist && gzip -c rdkit-wasm/dist/rdkit-embed.wasm | wc -c | xargs -I{} echo "rdkit-embed.wasm gzipped: {} bytes"

      - uses: actions/upload-artifact@v4
        with:
          name: rdkit-embed-wasm-${{ env.RDKIT_TAG }}
          path: |
            rdkit-wasm/dist/rdkit-embed.mjs
            rdkit-wasm/dist/rdkit-embed.wasm
          if-no-files-found: error
