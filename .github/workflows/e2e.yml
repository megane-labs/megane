name: E2E

# Pixel E2E in CI.
#
# Runs the webapp-host and JupyterLab-host Playwright projects inside the
# pinned Playwright container image, so the Chromium build and the system
# fonts/fontconfig are identical between the run that RECORDED the baselines
# and the run that COMPARES against them. This is what makes pixel diffs
# stable on hosted runners — the historical drift came from comparing
# dev-container captures against runner-rendered pages.
#
# The two historical CI blockers and their fixes:
#   - webapp/contract port-bind race: Playwright's webServer manager is
#     bypassed entirely (MEGANE_E2E_NO_WEBSERVER=1); the static server is
#     started explicitly and health-checked before the suite runs.
#   - fonts/fontconfig baseline drift: baselines live in
#     tests/e2e/baselines-ci/ and are captured inside this same container
#     by the "E2E update baselines" workflow (workflow_dispatch).
#
# The container tag MUST match the `playwright` version in package.json —
# bump them together.
#
# The VSCode-hosted projects (vscode, widget-vscode) remain local-only:
# they need a full code-server install and are not run here.
#
# The webapp-host projects take ~14 min on one runner, so they are split
# over three runners, one per `test:e2e:ci:webapp:<n>` script. The groups
# are balanced by measured run time, not test count: Playwright's --shard
# splits by count, and a pipeline-editor test costs ~3x a format-loading
# one, so the slowest of its three shards ran 1.5x an even split. Each
# runner keeps one worker: the renderer draws through SwiftShader on the
# CPU, and two browsers on one 4-vCPU runner slowed every test by ~45%.
# Add a new webapp-host project to `test:e2e:ci:webapp` and to the
# lightest shard; tests/ts/e2e-ci-shards.test.ts fails until they agree.
#
# The `scope` job skips the host groups a change cannot reach: a PR that only
# touches docs, the VS Code extension or the LLM proxy worker runs no E2E,
# and a Python-only PR runs only the JupyterLab hosts. The path lists live in
# scripts/e2e-scope.mjs; any path they do not list runs everything. A job
# skipped by its `if:` reports success, so required checks still resolve.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Dispatched by the "E2E update baselines" workflow after it pushes a
  # baseline commit: pushes made with GITHUB_TOKEN never fire push/PR
  # events (recursion guard), so the verification run on the new head has
  # to be triggered explicitly. workflow_dispatch is exempt from the guard.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which host groups the change can reach. The E2E jobs run unless this
  # answers "false", so if it fails they all run.
  scope:
    name: E2E scope
    runs-on: ubuntu-latest
    outputs:
      webapp: ${{ steps.scope.outputs.webapp }}
      jupyterlab: ${{ steps.scope.outputs.jupyterlab }}
    steps:
      - uses: actions/checkout@v4
        with:
          # A pull_request checkout is the PR merged into its base: the first
          # parent is the base, so HEAD^1..HEAD is exactly what the PR changes.
          fetch-depth: 2

      - name: Classify the changed paths
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) base=HEAD^1 ;;
            push) base=$BEFORE; git fetch --depth=1 origin "$base" || base= ;;
            *) base= ;;
          esac
          if [ -z "$base" ]; then
            echo "Nothing to compare a $EVENT event with; running every E2E job."
            printf 'webapp=true\njupyterlab=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git diff --name-only --no-renames "$base" HEAD | node scripts/e2e-scope.mjs

  e2e-webapp-shard:
    name: E2E webapp host (pixel) ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.webapp != 'false' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    strategy:
      # Let every shard finish so one run reports all pixel diffs.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      MEGANE_E2E_BASELINE_DIR: tests/e2e/baselines-ci
      MEGANE_E2E_REQUIRE_BASELINE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/e2e-setup

      - name: Start static webapp server
        run: |
          node tests/e2e/lib/serve-static.mjs python/megane/static/app 15173 127.0.0.1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:15173/ >/dev/null 2>&1; then
              echo "static server ready after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "::error::static server never became ready on :15173"
          exit 1

      - name: Run webapp-host Playwright projects
        env:
          MEGANE_E2E_NO_WEBSERVER: "1"
        run: npm run test:e2e:ci:webapp:${{ matrix.shard }}

      - name: Upload report and pixel diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-webapp-failure-${{ matrix.shard }}
          retention-days: 7
          path: |
            playwright-report/
            test-results/
            tests/e2e/baselines-ci/**/*.diff.png
            tests/e2e/baselines-ci/**/*.new.png

  # Keeps the single "E2E webapp host (pixel)" check that existed before the
  # split, so a branch-protection rule naming it still resolves. Green only
  # when every shard passed, or when `scope` found nothing they could test.
  e2e-webapp:
    name: E2E webapp host (pixel)
    needs: [scope, e2e-webapp-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every webapp shard to pass
        env:
          NEEDED: ${{ needs.scope.outputs.webapp }}
          SHARDS: ${{ needs.e2e-webapp-shard.result }}
        run: |
          if [ "$NEEDED" = false ]; then
            echo "No changed path can reach the webapp hosts; the shards were skipped."
            exit 0
          fi
          test "$SHARDS" = success

  e2e-jupyterlab:
    name: E2E JupyterLab hosts (pixel)
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.jupyterlab != 'false' }}
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
    env:
      MEGANE_E2E_BASELINE_DIR: tests/e2e/baselines-ci
      MEGANE_E2E_REQUIRE_BASELINE: "1"
      # The JupyterLab projects boot their own Jupyter servers and never
      # touch the webapp port; skip Playwright's webServer manager (whose
      # port handling is the historical CI flake) entirely.
      MEGANE_E2E_NO_WEBSERVER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/e2e-setup
        with:
          jupyterlab: "true"

      - name: Run JupyterLab-host Playwright projects
        run: PATH="$PWD/.venv/bin:$PATH" npm run test:e2e:ci:jupyterlab

      - name: Upload report and pixel diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-jupyterlab-failure
          retention-days: 7
          path: |
            playwright-report/
            test-results/
            tests/e2e/baselines-ci/**/*.diff.png
            tests/e2e/baselines-ci/**/*.new.png
