name: LLM Prompt Eval

# Opt-in benchmark: makes real, paid LLM API calls to score the LLM
# pipeline-generator (`bench/llm/`) on the PR branch ("after") and the PR's
# base branch ("before"), then posts a before/after comparison as a PR
# comment. Add the `llm-eval` label to a PR to run it.
#
# The provider is chosen by the `MEGANE_LLM_BENCH_PROVIDER` repository
# variable — `openrouter` (the default, key at https://openrouter.ai/keys),
# `plamo` (Preferred Networks' PLaMo API, key at https://plamo.preferredai.jp/),
# or `anthropic` (key at https://console.anthropic.com/) — and reads the
# matching repository secret (`OPENROUTER_API_KEY` / `PLAMO_API_KEY` /
# `ANTHROPIC_API_KEY`).
#
# The default scores Claude Haiku 4.5 through OpenRouter. For Sonnet, set
# `MEGANE_LLM_BENCH_MODEL` to the matching OpenRouter slug, or switch the
# provider to `anthropic` and use `claude-sonnet-5`.
# Note: GitHub does not expose
# repository secrets to `pull_request` workflows triggered from forks, so
# this only runs for PRs from branches within this repository.
#
# Because every run makes paid API calls, the job also checks the actor who
# triggered it (whoever applied the label, or opened/pushed the PR while the
# label was present) against an allowlist. Configure the allowlist with the
# `LLM_EVAL_ALLOWED_USERS` repository variable (Settings > Secrets and
# variables > Actions > Variables), a JSON array of GitHub usernames, e.g.
# `["alice","bob"]`. Defaults to `["hodakamori"]` if unset.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  llm-prompt-eval:
    name: LLM prompt before/after eval
    if: |
      contains(github.event.pull_request.labels.*.name, 'llm-eval') &&
      contains(fromJSON(vars.LLM_EVAL_ALLOWED_USERS || '["hodakamori"]'), github.actor)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout PR head (after)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: after

      - name: Checkout PR base (before)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: before

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies (after)
        working-directory: after
        run: npm ci

      - name: Install dependencies (before)
        working-directory: before
        run: npm ci

      # TEMPORARY: pinned to Sonnet 5 to answer "how does Sonnet score?".
      # Sonnet costs 2x Haiku per token ($2/$10 vs $1/$5 per MTok), and Haiku
      # already scores 98% mean / 100% pass rate here, so it is the better
      # standing default — this pin is meant to be reverted once the
      # comparison run is read. Set MEGANE_LLM_BENCH_MODEL to override, or
      # restore the `|| ''` fallback to go back to each provider's default in
      # bench/llm/providers.ts (plamo-3.0-prime for plamo,
      # anthropic/claude-haiku-4.5 for openrouter, claude-haiku-4-5 for
      # anthropic).
      - name: Run benchmark (after = PR branch)
        working-directory: after
        env:
          MEGANE_LLM_BENCH: "1"
          PLAMO_API_KEY: ${{ secrets.PLAMO_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MEGANE_LLM_PROVIDER: ${{ vars.MEGANE_LLM_BENCH_PROVIDER || 'openrouter' }}
          MEGANE_LLM_MODEL: ${{ vars.MEGANE_LLM_BENCH_MODEL || 'anthropic/claude-sonnet-5' }}
        run: |
          npx vitest run tests/ts/bench/llm.bench.test.ts
          cp "$(ls -t bench/llm/results/*.json | head -1)" "$GITHUB_WORKSPACE/after.json"

      - name: Run benchmark (before = base branch)
        working-directory: before
        env:
          MEGANE_LLM_BENCH: "1"
          PLAMO_API_KEY: ${{ secrets.PLAMO_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MEGANE_LLM_PROVIDER: ${{ vars.MEGANE_LLM_BENCH_PROVIDER || 'openrouter' }}
          MEGANE_LLM_MODEL: ${{ vars.MEGANE_LLM_BENCH_MODEL || 'anthropic/claude-sonnet-5' }}
        run: |
          npx vitest run tests/ts/bench/llm.bench.test.ts
          cp "$(ls -t bench/llm/results/*.json | head -1)" "$GITHUB_WORKSPACE/before.json"

      - name: Compare results
        run: node after/bench/llm/compare-results.mjs before.json after.json comparison.md

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: llm-prompt-eval-reports
          path: |
            before.json
            after.json
            comparison.md

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync("comparison.md", "utf-8");
            const marker = "<!-- llm-prompt-eval -->";
            const comment = `${marker}\n${body}`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: comment,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment,
              });
            }
