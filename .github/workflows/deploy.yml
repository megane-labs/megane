name: Deploy demo to AWS S3 + CloudFront

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-1
  APP_NAME: megane

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: |
          # Retry transient network failures from rustwasm.github.io (~once a week on GH-hosted runners).
          for i in 1 2 3; do
            curl -fsSL https://rustwasm.github.io/wasm-pack/installer/init.sh | sh && break
            echo "wasm-pack install attempt $i failed; retrying in $((i*5))s"
            sleep $((i*5))
          done

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - run: npm ci

      - run: npm run build:wasm

      # Inject the demo LLM proxy URL so the built app enables the free
      # "demo" provider (isDemoProviderAvailable() in src/ai/config.ts keys
      # off this) instead of falling back to BYOK. Same repo variable the
      # docs demo build uses.
      - run: npm run build:app
        env:
          VITE_LLM_PROXY_URL: ${{ vars.LLM_PROXY_URL }}

      - name: Verify build artifacts
        run: test -f python/megane/static/app/index.html

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Ensure S3 state bucket exists
        run: |
          set -euo pipefail
          aws s3api head-bucket --bucket "${APP_NAME}-terraform-state" 2>/dev/null || \
            aws s3 mb "s3://${APP_NAME}-terraform-state" --region "$AWS_REGION"

      - name: Terraform init
        working-directory: deploy/terraform
        run: terraform init

      - name: Terraform apply
        working-directory: deploy/terraform
        run: terraform apply -auto-approve

      - name: Export Terraform outputs
        id: tf
        working-directory: deploy/terraform
        run: |
          set -euo pipefail
          {
            echo "bucket_name=$(terraform output -raw bucket_name)"
            echo "distribution_id=$(terraform output -raw cloudfront_distribution_id)"
            echo "service_url=$(terraform output -raw service_url)"
          } >> "$GITHUB_OUTPUT"

      - name: Sync static site to S3
        run: |
          set -euo pipefail
          # Long cache for hashed Vite assets, short cache for every HTML
          # entrypoint so users always pick up the latest one after deploy.
          # Matched by extension rather than by name: the app has more than one
          # entry, and an immutable HTML file would pin users to asset hashes
          # the next --delete sync removes.
          aws s3 sync python/megane/static/app/ "s3://${{ steps.tf.outputs.bucket_name }}/" \
            --delete \
            --exclude "*.html" \
            --cache-control "public,max-age=31536000,immutable"
          for html in python/megane/static/app/*.html; do
            aws s3 cp "$html" \
              "s3://${{ steps.tf.outputs.bucket_name }}/$(basename "$html")" \
              --cache-control "public,max-age=0,must-revalidate" \
              --content-type "text/html; charset=utf-8"
          done

      - name: Invalidate CloudFront cache
        run: |
          set -euo pipefail
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.tf.outputs.distribution_id }}" \
            --paths "/*" \
            --no-cli-pager

      - name: Print deployment summary
        run: |
          {
            echo "## Deployment Complete"
            echo "URL: ${{ steps.tf.outputs.service_url }}"
            echo "Bucket: ${{ steps.tf.outputs.bucket_name }}"
            echo "Distribution: ${{ steps.tf.outputs.distribution_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
