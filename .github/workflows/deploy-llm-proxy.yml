name: Deploy LLM Proxy Worker

on:
  push:
    branches: [main]
    paths:
      - "workers/llm-proxy/**"
      - ".github/workflows/deploy-llm-proxy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-llm-proxy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # wrangler v4 (workers/llm-proxy devDependency) requires Node 22+. On
      # Node 20 the wrangler-action rejects the local install and falls back
      # to wrangler@3.90.0, which ERESOLVEs against @cloudflare/workers-types
      # v5 — the reason every deploy after PR #666 still failed.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/llm-proxy/package-lock.json

      - name: Install dependencies
        working-directory: workers/llm-proxy
        run: npm ci

      - name: Run tests
        working-directory: workers/llm-proxy
        run: npm test

      - name: Type-check
        working-directory: workers/llm-proxy
        run: npx tsc --noEmit

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: workers/llm-proxy
          command: deploy
          # Upload both provider API keys as Worker secrets on every deploy.
          # The Worker skips any provider whose key is empty at request time,
          # but both repository secrets (PLAMO_API_KEY, OPENROUTER_API_KEY)
          # must exist — wrangler-action fails on a name whose env value is
          # missing. The values are read from the job env below; only the
          # names are listed here. Cloudflare persists Worker secrets across
          # deploys, so this is idempotent.
          secrets: |
            PLAMO_API_KEY
            OPENROUTER_API_KEY
        env:
          PLAMO_API_KEY: ${{ secrets.PLAMO_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
