name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-python:
    name: Python lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uvx ruff check python/
      - run: uvx ruff format --check python/
      - run: uvx ty check python/

  lint-rust:
    name: Rust lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings

  test-rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --package megane-core --lcov --output-path lcov.info
      # Fork PRs: secrets are not passed to fork-triggered runs, so
      # CODECOV_TOKEN resolves to an empty string there. That is expected
      # and fine — Codecov accepts a tokenless upload for PRs from forks of
      # public repos, so the patch-coverage gate still works for external
      # contributors. Do NOT "fix" the empty token by gating this step on the
      # secret; that would silently skip the gate for forks. If a tokenless
      # upload fails transiently (rate limit), re-run the job.
      #
      # Every other run does need the token, including Dependabot's — GitHub
      # withholds repository Actions secrets there, so CODECOV_TOKEN must also
      # be stored under Settings -> Secrets and variables -> Dependabot. The
      # composite action below checks that before uploading; see
      # .github/actions/codecov-upload/action.yml. The same applies to the
      # test-ts and test-python upload steps.
      - uses: ./.github/actions/codecov-upload
        with:
          files: lcov.info
          flags: rust
          token: ${{ secrets.CODECOV_TOKEN }}

  test-ts:
    name: TypeScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: |
          # Retry transient network failures from rustwasm.github.io (~once a week on GH-hosted runners).
          for i in 1 2 3; do
            curl -fsSL https://rustwasm.github.io/wasm-pack/installer/init.sh | sh && break
            echo "wasm-pack install attempt $i failed; retrying in $((i*5))s"
            sleep $((i*5))
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build:wasm
      - run: npm run format:check
      - run: npm run lint
      - run: npm test -- --coverage
      - uses: ./.github/actions/codecov-upload
        with:
          files: coverage/ts/lcov.info
          flags: typescript
          token: ${{ secrets.CODECOV_TOKEN }}

  test-ts-react18:
    name: TypeScript tests (React 18)
    # megane-viewer declares peerDependencies react "^18.2.0 || ^19.0.0" while the
    # repo develops against React 19. This job swaps in React 18 (runtime + types)
    # and re-runs the type check and unit tests so the lower bound of the peer
    # range stays honest. No Codecov upload — the coverage gate is the React 19 job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: |
          # Retry transient network failures from rustwasm.github.io (~once a week on GH-hosted runners).
          for i in 1 2 3; do
            curl -fsSL https://rustwasm.github.io/wasm-pack/installer/init.sh | sh && break
            echo "wasm-pack install attempt $i failed; retrying in $((i*5))s"
            sleep $((i*5))
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build:wasm
      - name: Swap in React 18
        run: npm i --no-save react@18 react-dom@18 @types/react@18 @types/react-dom@18
      - run: npx tsc --noEmit
      - run: npx vitest run

  render-smoke:
    name: Bundle render smoke test
    # Builds the Vite bundles with the EXACT locked toolchain (npm ci) and loads
    # each one headless to assert the viewer mounts and the WebGL canvas draws.
    # This catches "blank webview" regressions (e.g. the Vite 8 / rolldown bundle
    # that shipped a blank VSCode extension in v0.9.0) that neither unit tests nor
    # the local-only E2E suite see, because the artifact that ships (CI `npm ci`)
    # is never the artifact the developer tested locally. Baseline-free, so it is
    # safe on hosted runners where pixel diffs are flaky.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: |
          for i in 1 2 3; do
            curl -fsSL https://rustwasm.github.io/wasm-pack/installer/init.sh | sh && break
            echo "wasm-pack install attempt $i failed; retrying in $((i*5))s"
            sleep $((i*5))
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build:wasm
      # Build the webapp bundle and the VSCode webview bundle with the locked deps.
      - run: npm run build:app
      - name: Build VSCode webview bundle
        run: cd vscode-megane && npm ci && npm run build:webview
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - run: npm run smoke:render

  test-python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: |
          # Retry transient network failures from rustwasm.github.io (~once a week on GH-hosted runners).
          for i in 1 2 3; do
            curl -fsSL https://rustwasm.github.io/wasm-pack/installer/init.sh | sh && break
            echo "wasm-pack install attempt $i failed; retrying in $((i*5))s"
            sleep $((i*5))
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build:wasm
      - run: npm run build:widget
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e ".[dev]"
      - run: python -m pytest --cov-report=xml:coverage.xml
      - uses: ./.github/actions/codecov-upload
        with:
          files: coverage.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}

  test-notebooks:
    name: Notebook tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: |
          # Retry transient network failures from rustwasm.github.io (~once a week on GH-hosted runners).
          for i in 1 2 3; do
            curl -fsSL https://rustwasm.github.io/wasm-pack/installer/init.sh | sh && break
            echo "wasm-pack install attempt $i failed; retrying in $((i*5))s"
            sleep $((i*5))
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: PUPPETEER_SKIP_DOWNLOAD=1 npm ci
      - run: npm run build:wasm
      - run: npm run build:widget
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package and notebook dependencies
        run: pip install -e ".[dev]" jupyterlab
      - name: Run notebook tests
        run: python -m pytest tests/python/test_notebooks.py -v

  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: |
          # Retry transient network failures from rustwasm.github.io (~once a week on GH-hosted runners).
          for i in 1 2 3; do
            curl -fsSL https://rustwasm.github.io/wasm-pack/installer/init.sh | sh && break
            echo "wasm-pack install attempt $i failed; retrying in $((i*5))s"
            sleep $((i*5))
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run build:wasm
      - run: npm run build:widget
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Run integration tests
        run: python -m pytest tests/python/test_serve_integration.py tests/python/test_demo_code.py -v

  build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t megane:ci .

  test-sdist:
    name: sdist self-contained build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install wasm-pack
        run: |
          # Retry transient network failures from rustwasm.github.io.
          for i in 1 2 3; do
            curl -fsSL https://rustwasm.github.io/wasm-pack/installer/init.sh | sh && break
            echo "wasm-pack install attempt $i failed; retrying in $((i*5))s"
            sleep $((i*5))
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install jupyterlab maturin
      - run: npm ci
      - run: npm run build
      - run: maturin sdist --out dist
      - name: Verify wheel-share present in sdist
        run: |
          tar -tzf dist/*.tar.gz | grep -q 'wheel-share/data/share/jupyter/labextensions/' \
            || { echo "::error::sdist missing labextension data"; exit 1; }
      - name: Build wheel from extracted sdist
        run: |
          mkdir _sdist_check && cd _sdist_check
          tar -xzf ../dist/*.tar.gz
          cd megane-*
          pip wheel --no-deps . -w ../out
          python -c "import zipfile, glob; z = zipfile.ZipFile(glob.glob('../out/*.whl')[0]); assert any('share/jupyter/labextensions/megane-jupyterlab' in n for n in z.namelist()), 'labextension missing from wheel'; print('OK')"

  # Cross-platform 3-layer E2E (`tests/e2e/*.spec.ts`):
  #
  # The webapp-host and JupyterLab-host projects run in CI via
  # `.github/workflows/e2e.yml`, inside the pinned Playwright container
  # image, against the CI-recorded baselines in `tests/e2e/baselines-ci/`
  # (re-recorded by the "E2E update baselines" workflow_dispatch workflow
  # in the same container). This sidesteps the two problems that used to
  # keep E2E out of CI: the webapp port-bind race (the static server is
  # now started explicitly, not by Playwright's webServer manager) and
  # fonts/fontconfig baseline drift (record and compare happen in the
  # same container image).
  #
  # The VSCode-hosted projects (`vscode`, `widget-vscode`) remain
  # local-only, and `tests/e2e/baselines/` remains the local dev baseline
  # set. See `.claude/skills/e2e-coverage/SKILL.md` for the full runbook.
