[package]
name = "megane-core"
version = "0.14.0"
edition = "2021"
description = "Core molecular structure parsers (PDB, GRO, XYZ, MOL, CIF, LAMMPS, XTC, .traj)"
authors = ["hodakamori"]
license = "MIT"
repository = "https://github.com/megane-labs/megane"

[dependencies]
serde_json = "1"
# Pull-parser XML reader for the CML and Chem3D-XML parsers. Chosen over a
# DOM-building crate for its small WASM footprint, and because it performs no
# DTD processing or custom entity expansion -- an untrusted .cml cannot mount
# an XXE or billion-laughs attack through it. "encoding" is left off: megane
# reads XML that has already been decoded to a Rust &str.
quick-xml = { version = "0.38", default-features = false }

[dev-dependencies]
tempfile = "3"

# Dependency-free A/B parser benchmark (std timing only, no criterion).
# Run with: cargo bench -p megane-core
[[bench]]
name = "parsers"
harness = false
